name: Haskell Build and Azure OIDC

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write # Requerido para la autenticación OIDC con Azure
  contents: read

jobs:
  build-and-auth:
    runs-on: ubuntu-latest
    env:
      AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }} # Ejemplo de uso de secreto

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🛠️ Setup Haskell with Stack
        uses: haskell/actions/setup@v2
        with:
          ghc-version: 'latest' # O la versión específica que uses (ej: 9.6.5)
          stack-version: 'latest'
          enable-stack: true

      - name: 📦 Restore Stack dependencies cache
        uses: actions/cache@v4
        with:
          # NOTA: La ruta del cache ahora apunta dentro de la carpeta haskell-server
          path: |
            ~/.stack
            haskell-server/.stack-work # <- CAMBIO CRUCIAL
          key: ${{ runner.os }}-stack-${{ hashFiles('haskell-server/stack.yaml', 'haskell-server/package.yaml') }} # <- CAMBIO CRUCIAL
          restore-keys: |
            ${{ runner.os }}-stack-
            
      - name: ⚙️ Pre-configure Global Resolver
        run: |
          mkdir -p ~/.stack/global-project
          echo "resolver: lts-22.14" > ~/.stack/global-project/stack.yaml          
        
      - name: ⚙️ Stack build in haskell-server
        # Usamos 'working-directory' para ejecutar el comando dentro de la carpeta correcta
        run: stack build --fast
        working-directory: haskell-server # <- CAMBIO CRUCIAL

      - name: 🧪 Stack test (Opcional)
        run: stack test

      - name: 🔑 Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ☁️ Azure CLI Action (Ejemplo)
        run: |
          echo "Ejecutando comando de Azure CLI después de la autenticación."
          # Aquí usas azure_identity automáticamente por el login de OIDC.
          # Si tu código Haskell usa DefaultAzureCredential (que es la recomendada),
          # capturará automáticamente el token de la sesión de Azure CLI establecida por 'azure/login'.
          az group show --name ${{ env.AZURE_RESOURCE_GROUP }}
