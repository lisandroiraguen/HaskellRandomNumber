name: Azure Function Deployment (Pre-Built)

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    
    steps:
    
    # 1. Checkout Code
    - uses: actions/checkout@v4
    
    # 2. Create Deployment Package 📦
    - name: Prepare Deployment Package
      run: |
        # Create the package directory
        mkdir deploy_package
        
        # Copy the required files and folders from the repository root
        
        # Copy the host.json file
        cp host.json deploy_package/
        
        # Copy the function folder (HaskellTrigger)
        cp -r HaskellTrigger deploy_package/
        
        # Copy the pre-built Haskell executable. The source and destination name are the same.
        cp haskell-server.exe deploy_package/
        
        # Note: local.settings.json should NOT be deployed to Azure.
        
    - name: Azure Login
      uses: azure/login@v1
      with:
        # This points to the secret you just created
        creds: ${{ secrets.AZURE_CREDENTIALS }} 
        
    - name: 'Deploy to Azure Function'
      uses: azure/functions-action@v1
      with:
        app-name: 'haskellrandom' 
        package: 'deploy_package/' 
        # No 'publish-profile' is needed here, as login handles authentication
